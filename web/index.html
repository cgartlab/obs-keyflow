<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>obs-keyflow</title>
<!--
  obs-keyflow 叠加画面（OBS 浏览器源）
  URL 参数：
    ?n=5          显示最近几个按键（默认 5）
    ?ttl=3000     每个键帽出现后多久消失 ms（默认 3000 = 3 秒）
    ?fade=450     消失前最后多久开始淡出 ms（默认 450）
    ?anchor=bc    吸附位置：tl/tc/tr/ml/c/mr/bl/bc/br，也接受 top-left、right、bottom 等写法
                  （默认 bc = 底部居中；c = 正中）
    ?margin=44    距吸附边缘的像素距离（?bottom= 为兼容旧写法，等价于 margin）
    ?size=64      键帽尺寸 px（默认 64）
    ?gap=10       键帽间距 px（默认 10）
    ?mode=full    切换成整块键盘（默认 recent）
    ?history=1    full 模式下额外显示按键历史串
    ?debug=1      左上角显示连接状态点（排查用，默认关闭）
-->
<style>
  :root {
    --n-size: 64px;
    --gap: 10px;
    --pad: 12px;
    --radius: 14px;
    --g2: 7px;

    --glass: rgba(9, 11, 16, 0.86);
    --edge: rgba(255, 255, 255, 0.10);
    --key: rgba(255, 255, 255, 0.065);
    --key-edge: rgba(255, 255, 255, 0.16);
    --legend: rgba(255, 255, 255, 0.86);
    --legend-dim: rgba(255, 255, 255, 0.44);
    --hot: #ffffff;
    --hot-ink: #0a0d13;
    --glow: rgba(122, 168, 255, 0.55);
  }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Inter", "SF Pro Text", "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #dock {
    position: fixed;
    /* 定位由 JS 按 ?anchor= / ?margin= 计算后写入，见 applyAnchor() */
    padding: var(--pad);
    box-sizing: border-box;
    border-radius: calc(var(--radius) + 8px);
    background: var(--glass);
    border: 1px solid var(--edge);
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    opacity: 0;                          /* 无内容时整条淡出，不占画面 */
    pointer-events: none;
    transition: opacity .12s linear;
  }
  #dock.show { opacity: 1; }

  /* ---------- 模式一：最近按键 ---------- */
  #strip {
    display: flex;
    align-items: center;
    gap: var(--gap);
    height: var(--n-size);
  }
  .rcap {
    box-sizing: border-box;
    height: var(--n-size);
    min-width: var(--n-size);
    padding: 0 calc(var(--n-size) * 0.26);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius);
    background: var(--key);
    border: 1px solid var(--key-edge);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 1px 2px rgba(0, 0, 0, 0.35);
    color: var(--legend);
    font-size: calc(var(--n-size) * 0.40);
    font-weight: 560;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    transition: background .09s ease, color .09s ease, box-shadow .09s ease,
                border-color .09s ease, transform .09s ease;
    user-select: none;
    white-space: nowrap;
  }
  .rcap.w2 { font-size: calc(var(--n-size) * 0.29); padding: 0 calc(var(--n-size) * 0.21); }
  .rcap.w3 { font-size: calc(var(--n-size) * 0.235); padding: 0 calc(var(--n-size) * 0.17); letter-spacing: 0.01em; }
  .rcap .plus { opacity: 0.42; margin: 0 0.07em; font-weight: 400; }
  .rcap.on {
    background: var(--hot);
    border-color: #fff;
    color: var(--hot-ink);
    transform: translateY(1px);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.85), 0 0 22px var(--glow), 0 0 44px rgba(122, 168, 255, 0.28);
  }
  .rcap.pop { animation: pop .16s ease-out; }
  @keyframes pop { from { transform: scale(0.9); } to { transform: scale(1); } }

  /* ---------- 模式二：整块键盘 ---------- */
  #keyboard { display: none; }
  #keyboard .row { display: flex; align-items: stretch; height: var(--kh); margin-bottom: var(--g2); }
  #keyboard .row:last-child { margin-bottom: 0; }
  #keyboard .row.fn { height: calc(var(--kh) * 0.72); }
  #keyboard .k { box-sizing: border-box; padding-right: var(--g2); display: flex; }
  #keyboard .k:last-child { padding-right: 0; }
  #keyboard .cap {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: var(--key);
    border: 1px solid var(--key-edge);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 1px 2px rgba(0, 0, 0, 0.35);
    color: var(--legend);
    font-size: calc(var(--kh) * 0.34);
    font-weight: 560;
    text-transform: uppercase;
    transition: background .07s ease, color .07s ease, box-shadow .07s ease,
                border-color .07s ease, transform .07s ease;
    user-select: none;
  }
  #keyboard .cap.wide-label { font-size: calc(var(--kh) * 0.26); letter-spacing: 0.06em; }
  #keyboard .cap .sub {
    position: absolute;
    top: 4px; right: 6px;
    font-size: calc(var(--kh) * 0.22);
    color: var(--legend-dim);
    font-weight: 500;
    text-transform: none;
  }
  #keyboard .cap.on {
    background: var(--hot);
    border-color: #fff;
    color: var(--hot-ink);
    transform: translateY(1px);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.85), 0 0 22px var(--glow), 0 0 44px rgba(122, 168, 255, 0.28);
  }
  #keyboard .cap.on .sub { color: rgba(10, 13, 19, 0.55); }
  #history {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
    height: 22px;
    margin-bottom: 10px;
    overflow: hidden;
    font: 500 12px/1 "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
    color: var(--legend-dim);
    white-space: nowrap;
  }

  /* ---------- 调试指示 ---------- */
  #dot {
    position: fixed;
    left: 10px; top: 10px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #e5484d;
    box-shadow: 0 0 8px rgba(229, 72, 77, 0.7);
    display: none;
  }
  #dot.on { background: #30d158; box-shadow: 0 0 8px rgba(48, 209, 88, 0.7); }
  body.debug #dot { display: block; }
</style>
</head>
<body>
  <div id="dot"></div>
  <div id="dock">
    <div id="strip"></div>
    <div id="keyboard"><div id="history"></div><div id="keys"></div></div>
  </div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const root = document.documentElement;
  if (qs.has('size')) root.style.setProperty('--n-size', qs.get('size') + 'px');
  if (qs.has('gap')) root.style.setProperty('--gap', qs.get('gap') + 'px');

  const MODE = qs.get('mode') === 'full' ? 'full' : 'recent';
  const SHOW_N = Math.max(1, parseInt(qs.get('n') || '5', 10) || 5);
  const SHOW_HISTORY = qs.get('history') === '1';
  const DEBUG = qs.get('debug') === '1';
  const STUCK_MS = 8000;

  // ---------- 吸附位置：?anchor= 九宫格，?margin= 距边缘像素 ----------
  const ANCHOR_GRID = {
    tl: ['left', 'top'],    tc: ['center', 'top'],    tr: ['right', 'top'],
    ml: ['left', 'middle'], c:  ['center', 'middle'], mr: ['right', 'middle'],
    bl: ['left', 'bottom'], bc: ['center', 'bottom'], br: ['right', 'bottom'],
  };
  const ANCHOR_ALIAS = {
    'top-left': 'tl', topleft: 'tl', 'left-top': 'tl',
    'top-center': 'tc', topcenter: 'tc', top: 'tc', 'top-middle': 'tc', topmiddle: 'tc', 'center-top': 'tc',
    'top-right': 'tr', topright: 'tr', 'right-top': 'tr',
    left: 'ml', 'middle-left': 'ml', middleleft: 'ml', 'left-center': 'ml', 'center-left': 'ml', 'left-middle': 'ml',
    center: 'c', centre: 'c', middle: 'c',
    right: 'mr', 'middle-right': 'mr', middleright: 'mr', 'right-center': 'mr', 'center-right': 'mr', 'right-middle': 'mr',
    'bottom-left': 'bl', bottomleft: 'bl', 'left-bottom': 'bl',
    'bottom-center': 'bc', bottomcenter: 'bc', bottom: 'bc', 'bottom-middle': 'bc', 'center-bottom': 'bc',
    'bottom-right': 'br', bottomright: 'br', 'right-bottom': 'br',
  };

  function parseAnchor(raw) {
    const key = String(raw ?? '').trim().toLowerCase().replace(/[_\s]+/g, '-');
    if (!key) return 'bc';
    if (ANCHOR_GRID[key]) return key;
    if (ANCHOR_ALIAS[key]) return ANCHOR_ALIAS[key];
    console.warn('[obs-keyflow] 无法识别的 anchor:', raw, '→ 回退 bottom-center');
    return 'bc';
  }

  const ANCHOR = parseAnchor(qs.get('anchor'));
  const rawMargin = qs.has('margin') ? qs.get('margin') : qs.get('bottom');
  const MARGIN = Math.max(0, parseInt(rawMargin ?? '44', 10) || 0);

  if (DEBUG) document.body.classList.add('debug');
  const dot = document.getElementById('dot');
  const dock = document.getElementById('dock');
  const stripEl = document.getElementById('strip');
  const kbEl = document.getElementById('keyboard');

  // 按 ?anchor= / ?margin= 贴边；两轴统一 margin，居中轴用 translate 抵消自身宽度
  function applyAnchor() {
    const [h, v] = ANCHOR_GRID[ANCHOR];
    dock.style.left = 'auto';
    dock.style.right = 'auto';
    dock.style.top = 'auto';
    dock.style.bottom = 'auto';
    if (h === 'left') dock.style.left = MARGIN + 'px';
    else if (h === 'right') dock.style.right = MARGIN + 'px';
    else dock.style.left = '50%';
    if (v === 'top') dock.style.top = MARGIN + 'px';
    else if (v === 'bottom') dock.style.bottom = MARGIN + 'px';
    else dock.style.top = '50%';
    const tx = h === 'center' ? 'translateX(-50%)' : '';
    const ty = v === 'middle' ? 'translateY(-50%)' : '';
    dock.style.transform = `${tx} ${ty}`.trim() || 'none';
  }
  applyAnchor();
  window.addEventListener('resize', applyAnchor);

  if (MODE === 'full') { stripEl.style.display = 'none'; kbEl.style.display = 'block'; }

  // 键位 id → 显示标签（id 由服务端 keymap.py 输出，属于稳定契约）
  const NICE = {
    backspace: 'Backspace', enter: 'Enter', tab: 'Tab', space: 'Space', esc: 'Esc',
    capslock: 'Caps', shiftleft: 'Shift', shiftright: 'Shift',
    controlleft: 'Ctrl', controlright: 'Ctrl', altleft: 'Alt', altright: 'Alt',
    metaleft: 'Win', metaright: 'Win', contextmenu: 'Menu',
    arrowleft: '←', arrowup: '↑', arrowright: '→', arrowdown: '↓',
    insert: 'Ins', delete: 'Del', home: 'Home', end: 'End',
    pageup: 'PgUp', pagedown: 'PgDn', printscreen: 'PrtSc', scrolllock: 'ScrLk', numlock: 'Num',
    pause: 'Pause',
    minus: '-', equal: '=', backquote: '`', bracketleft: '[', bracketright: ']',
    backslash: '\\', semicolon: ';', quote: "'", comma: ',', period: '.', slash: '/',
    numpadadd: 'Num+', numpadsubtract: 'Num-', numpadmultiply: 'Num*', numpaddivide: 'Num/',
    numpaddecimal: 'Num.',
    volumeup: 'Vol+', volumedown: 'Vol-', audiomute: 'Mute',
    medianext: 'Next', mediaprev: 'Prev', mediastop: 'Stop', mediaplay: 'Play',
  };
  const pretty = (id) => NICE[id]
    || id.replace(/^f(\d+)$/i, 'F$1')
        .replace(/^numpad(\d)$/, 'Num$1')
        .toUpperCase();

  // ---------- 模式一：最近按键（组合键用 + 连接，按 ?ttl 后淡出消失） ----------
  const TTL_MS = Math.max(500, parseInt(qs.get('ttl') || '3000', 10) || 3000);
  const FADE_MS = Math.max(150, Math.min(TTL_MS, parseInt(qs.get('fade') || '450', 10) || 450));
  const TICK_MS = 33;

  const entries = [];   // { parts, held, closed, ids, expires, el }
  const MOD_RANK = {
    controlleft: 0, controlright: 0,
    metaleft: 1, metaright: 1,
    altleft: 2, altright: 2,
    shiftleft: 3, shiftright: 3,
  };
  const isMod = (id) => Object.prototype.hasOwnProperty.call(MOD_RANK, id);
  let heldMods = [];
  let ticker = null;

  function modsText() {
    const seen = new Set();
    const out = [];
    for (const id of [...heldMods].sort((a, b) => MOD_RANK[a] - MOD_RANK[b])) {
      const name = pretty(id);
      if (!seen.has(name)) { seen.add(name); out.push(name); }
    }
    return out;
  }

  function sizeClass(parts) {
    const len = parts.join('+').length;
    if (len <= 3) return '';
    if (len <= 6) return ' w2';
    return ' w3';
  }

  function fillCap(node, e) {
    node.textContent = '';
    e.parts.forEach((p, idx) => {
      if (idx > 0) {
        const plus = document.createElement('span');
        plus.className = 'plus';
        plus.textContent = '+';
        node.appendChild(plus);
      }
      node.appendChild(document.createTextNode(p));
    });
    node.className = 'rcap' + sizeClass(e.parts) + (e.held ? ' on' : '');
  }

  function mount(e) {
    e.el = document.createElement('div');
    fillCap(e.el, e);
    e.el.classList.add('pop');
    stripEl.appendChild(e.el);
    setTimeout(() => { if (e.el) e.el.classList.remove('pop'); }, 200);
  }

  // 每 33ms 重算剩余寿命：前段保持全亮，最后 fade 段线性淡出，归零即移除
  function paint() {
    const now = performance.now();
    let maxTail = 0;
    for (let i = entries.length - 1; i >= 0; i--) {
      const e = entries[i];
      if (e.held) e.expires = now + TTL_MS;      // 按住期间不计时
      const remain = e.expires - now;
      if (remain <= 0) {
        if (e.el) e.el.remove();
        entries.splice(i, 1);
        continue;
      }
      if (e.el) {
        e.el.classList.toggle('on', e.held);
        const newest = i === entries.length - 1;
        const base = newest ? 1 : 0.86;           // 旧的略暗，保留层次
        const tail = Math.min(1, remain / FADE_MS);
        maxTail = Math.max(maxTail, tail);
        e.el.style.opacity = String(base * tail);
      }
    }
    const alive = entries.length > 0;
    dock.classList.toggle('show', alive);
    // 胶囊整体跟着最后一批键帽一起淡出，避免留下一个空的黑条
    dock.style.opacity = alive ? String(maxTail) : '';
    if (!alive) stopTicker();
  }

  function startTicker() { if (!ticker && MODE === 'recent') ticker = setInterval(paint, TICK_MS); }
  function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }

  function pushEntry(e) {
    entries.push(e);
    mount(e);
    while (entries.length > SHOW_N) {
      const gone = entries.shift();
      if (gone.el) gone.el.remove();
    }
    startTicker();
  }

  function onDown(id) {
    const now = performance.now();
    if (isMod(id)) {
      if (!heldMods.includes(id)) heldMods.push(id);
      const parts = modsText();
      const last = entries[entries.length - 1];
      if (last && !last.closed) {                 // Ctrl → Ctrl+Shift 就地更新
        last.parts = parts;
        last.held = true;
        last.ids.push(id);
        last.expires = now + TTL_MS;
        fillCap(last.el, last);
      } else {
        pushEntry({ parts, held: true, closed: false, ids: [id], expires: now + TTL_MS, el: null });
      }
    } else {
      const parts = modsText().concat([pretty(id)]);
      const last = entries[entries.length - 1];
      if (last && !last.closed) {                 // 悬空的修饰键 + 普通键 → 合成 Ctrl+C
        last.parts = parts;
        last.held = true;
        last.closed = true;
        last.ids.push(id);
        last.expires = now + TTL_MS;
        fillCap(last.el, last);
      } else {
        pushEntry({ parts, held: true, closed: true, ids: [id], expires: now + TTL_MS, el: null });
      }
    }
    paint();
  }

  function onUp(id) {
    const mi = heldMods.indexOf(id);
    if (mi >= 0) heldMods.splice(mi, 1);
    const now = performance.now();
    const last = entries[entries.length - 1];
    if (!last) return;
    if (!last.closed) {
      const parts = modsText();
      if (!parts.length) {                        // 只按了修饰键又松开 → 该枚直接退出
        if (last.el) last.el.remove();
        entries.pop();
      } else {
        last.parts = parts;
        last.held = true;
        last.expires = now + TTL_MS;
        fillCap(last.el, last);
      }
    } else {
      last.held = false;
      last.expires = now + TTL_MS;                // 松开后开始倒计时
    }
    paint();
  }

  function clearRecent() {
    for (const e of entries) if (e.el) e.el.remove();
    dock.style.opacity = '';
    entries.length = 0;
    heldMods = [];
    stopTicker();
    dock.classList.remove('show');
  }

  // ---------- 模式二：整块键盘 ----------
  const ROWS = [
    { cls: 'fn', keys: [
      ['esc', 1, 'Esc'], [null, 1],
      ['f1', 1, 'F1'], ['f2', 1, 'F2'], ['f3', 1, 'F3'], ['f4', 1, 'F4'], [null, 0.5],
      ['f5', 1, 'F5'], ['f6', 1, 'F6'], ['f7', 1, 'F7'], ['f8', 1, 'F8'], [null, 0.5],
      ['f9', 1, 'F9'], ['f10', 1, 'F10'], ['f11', 1, 'F11'], ['f12', 1, 'F12'],
    ]},
    { keys: [
      ['backquote', 1, '`', '~'], ['1', 1, '1', '!'], ['2', 1, '2', '@'], ['3', 1, '3', '#'],
      ['4', 1, '4', '$'], ['5', 1, '5', '%'], ['6', 1, '6', '^'], ['7', 1, '7', '&'],
      ['8', 1, '8', '*'], ['9', 1, '9', '('], ['0', 1, '0', ')'], ['minus', 1, '-', '_'],
      ['equal', 1, '=', '+'], ['backspace', 2, 'Backspace', null, true],
    ]},
    { keys: [
      ['tab', 1.5, 'Tab', null, true],
      ['q', 1, 'Q'], ['w', 1, 'W'], ['e', 1, 'E'], ['r', 1, 'R'], ['t', 1, 'T'],
      ['y', 1, 'Y'], ['u', 1, 'U'], ['i', 1, 'I'], ['o', 1, 'O'], ['p', 1, 'P'],
      ['bracketleft', 1, '[', '{'], ['bracketright', 1, ']', '}'], ['backslash', 1.5, '\\', '|'],
    ]},
    { keys: [
      ['capslock', 1.75, 'Caps', null, true],
      ['a', 1, 'A'], ['s', 1, 'S'], ['d', 1, 'D'], ['f', 1, 'F'], ['g', 1, 'G'],
      ['h', 1, 'H'], ['j', 1, 'J'], ['k', 1, 'K'], ['l', 1, 'L'],
      ['semicolon', 1, ';', ':'], ['quote', 1, "'", '"'], ['enter', 2.25, 'Enter', null, true],
    ]},
    { keys: [
      ['shiftleft', 2.25, 'Shift', null, true],
      ['z', 1, 'Z'], ['x', 1, 'X'], ['c', 1, 'C'], ['v', 1, 'V'], ['b', 1, 'B'],
      ['n', 1, 'N'], ['m', 1, 'M'],
      ['comma', 1, ',', '<'], ['period', 1, '.', '>'], ['slash', 1, '/', '?'],
      ['shiftright', 2.75, 'Shift', null, true],
    ]},
    { keys: [
      ['controlleft', 1.25, 'Ctrl', null, true], ['metaleft', 1.25, 'Win', null, true],
      ['altleft', 1.25, 'Alt', null, true], ['space', 6.25, '', null, true],
      ['altright', 1.25, 'Alt', null, true], ['metaright', 1.25, 'Win', null, true],
      ['contextmenu', 1.25, 'Menu', null, true], ['controlright', 1.25, 'Ctrl', null, true],
    ]},
  ];

  const capById = new Map();
  const history = [];
  const histEl = document.getElementById('history');

  if (MODE === 'full') {
    const keysEl = document.getElementById('keys');
    for (const row of ROWS) {
      const r = document.createElement('div');
      r.className = 'row' + (row.cls ? ' ' + row.cls : '');
      for (const k of row.keys) {
        const [id, units, label, sub, wide] = k;
        const holder = document.createElement('div');
        holder.className = 'k';
        holder.style.flex = units + ' 0 0';
        if (id) {
          const cap = document.createElement('div');
          cap.className = 'cap' + (wide ? ' wide-label' : '');
          cap.textContent = label;
          if (sub) {
            const s = document.createElement('span');
            s.className = 'sub';
            s.textContent = sub;
            cap.appendChild(s);
          }
          capById.set(id, cap);
          holder.appendChild(cap);
        }
        r.appendChild(holder);
      }
      keysEl.appendChild(r);
    }
    if (!SHOW_HISTORY) { histEl.style.display = 'none'; histEl.style.marginBottom = '0'; }
    const fit = () => root.style.setProperty('--u', (keysEl.clientWidth / 15) + 'px');
    fit();
    window.addEventListener('resize', fit);
    dock.classList.add('show');       // 整块键盘模式常显
  }

  function pushHistory(id) {
    if (MODE !== 'full' || !SHOW_HISTORY) return;
    history.push(id);
    while (history.length > 16) history.shift();
    histEl.innerHTML = '';
    for (const h of history) {
      const s = document.createElement('span');
      s.textContent = pretty(h);
      histEl.appendChild(s);
    }
  }

  // ---------- 事件分发 ----------
  const stuck = new Map();          // 仅 full 模式：兜底松开
  function press(id) {
    pushHistory(id);
    if (MODE === 'recent') { onDown(id); return; }
    const cap = capById.get(id);
    if (cap) cap.classList.add('on');
    clearTimeout(stuck.get(id));
    stuck.set(id, setTimeout(() => release(id), STUCK_MS));
  }
  function release(id) {
    if (MODE === 'recent') { onUp(id); return; }
    const cap = capById.get(id);
    if (cap) cap.classList.remove('on');
    clearTimeout(stuck.get(id));
    stuck.delete(id);
  }
  function clearAll() {
    if (MODE === 'recent') { clearRecent(); return; }
    for (const id of [...stuck.keys()]) release(id);
    for (const cap of capById.values()) cap.classList.remove('on');
  }

  function connect() {
    const es = new EventSource('/events');
    es.onopen = () => { if (DEBUG) dot.classList.add('on'); };
    es.onerror = () => {
      if (DEBUG) dot.classList.remove('on');
      // EventSource 自动重连；重连期间清空按住状态，避免残留
      clearAll();
      render();
    };
    es.onmessage = (ev) => {
      let m;
      try { m = JSON.parse(ev.data); } catch { return; }
      if (m.t === 'snap') {
        clearAll();
        for (const id of m.pressed) press(id);
      } else if (m.t === 'key') {
        m.d ? press(m.k) : release(m.k);
      }
    };
  }
  connect();

  window.addEventListener('blur', clearAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearAll(); });
})();
</script>
</body>
</html>
